name: build-exe
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pyinstaller
      - name: Stamp build id
        shell: bash
        run: printf 'BUILD = "%s"\n' "$GITHUB_SHA" > mpanel/_build.py
      - name: Build (one file)
        shell: cmd
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed --name MediaPanel --icon assets/icon.ico
          --collect-submodules winrt --collect-binaries winrt --collect-data winrt
          --hidden-import winrt.windows.media.control --hidden-import winrt.windows.storage.streams
          --hidden-import winrt.windows.foundation --hidden-import winrt.windows.foundation.collections
          --hidden-import mpanel._build
          --exclude-module tkinter main.py
      - name: Selftest
        continue-on-error: true
        shell: pwsh
        run: |
          $p = Start-Process dist\MediaPanel.exe -ArgumentList '--selftest' -Wait -PassThru
          if (Test-Path dist\selftest.txt) { Get-Content dist\selftest.txt }
          exit $p.ExitCode
      - uses: actions/upload-artifact@v4
        with:
          name: MediaPanel
          path: |
            dist/MediaPanel.exe
            dist/selftest.txt
      - name: Move latest tag
        shell: bash
        run: |
          git tag -f latest
          git push -f origin latest
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Media Panel (последняя сборка)
          body: ${{ github.sha }}
          files: |
            dist/MediaPanel.exe
            dist/selftest.txt
